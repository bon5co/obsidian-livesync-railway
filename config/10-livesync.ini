; CouchDB settings required by the Obsidian Self-hosted LiveSync plugin.
;
; These are not hand-picked: they are the exact settings applied by upstream's own
; provisioning tool, utils/couchdb/provision.ts in vrtmrz/obsidian-livesync, which
; docs/setup_own_server.md makes a mandatory step ("2. Run couchdb-init.sh for
; initialise"). Baking them into the image means the deploy is already provisioned,
; instead of asking the deployer to install Deno and run a script against their
; own server.
;
; The port is appended to [chttpd] at boot by railway-entrypoint.sh, because
; Railway chooses it at deploy time.

[couchdb]
single_node = true
max_document_size = 50000000

[chttpd]
bind_address = 0.0.0.0
max_http_request_size = 4294967296

; provision.ts: "require authenticated HTTP users".
require_valid_user = true

; ... but Railway's healthcheck is an unauthenticated GET of /_up, and
; require_valid_user makes CouchDB answer 401 to it, which fails the deploy.
; This exemption exists for exactly that case and is scoped to /_up alone.
require_valid_user_except_for_up = true

[chttpd_auth]
; provision.ts: "require authenticated HTTP users for authentication".
require_valid_user = true

[httpd]
; provision.ts: "set the HTTP authentication challenge".
WWW-Authenticate = Basic realm="couchdb"
; provision.ts: "enable HTTP CORS".
enable_cors = true

[cors]
; provision.ts DEFAULT_ORIGINS. capacitor://localhost is the mobile Obsidian
; origin; app://obsidian.md is desktop.
origins = app://obsidian.md,capacitor://localhost,http://localhost
credentials = true
methods = GET, PUT, POST, HEAD, DELETE
headers = accept, authorization, content-type, origin, referer, cache-control, x-requested-with

[cluster]
q = 1
n = 1

[log]
level = info
